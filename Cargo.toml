# Havok Physics 2021.2 — Rust 单 crate 工程
#
# 原 workspace 成员已退化为 crates/* 下的普通模块文件夹；根 crate 的名称为
# proton-engine（lib 名 proton），通过模块路径统一暴露全部 API。
# 迁移计划与“惯用 Rust、非 1:1 C++ 复刻”准则见 README.md。

[package]
name = "proton-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Single-crate Rust port of the Havok Physics 2021.2 runtime"

[lib]
name = "proton"
path = "src/lib.rs"

[[bench]]
name = "simulation"
harness = false

[dependencies]
glam = "0.34.3"

# Floating-point determinism note:
# Havok's simulation relies on bit-exact float32 reproduction. Rust does not
# reorder or contract FP expressions by default - keep it that way. Never
# enable fast-math style optimizations (FMA contraction, reassociation) in
# math or solver code, and validate against the C++ golden traces (Phase 9).
#
# 设计准则：不要求 1:1 复刻 C++ 结构，优先使用 Rust 语言特性（enum/Option/
# Result/trait/迭代器/RAII）；确定性约束只保留在数值热点与既有 golden trace。
# 当前零外部依赖；按阶段引入依赖时在此处声明。
