# Havok Physics 2021.2 — Rust workspace (virtual manifest)
#
# Migration plan: see README.md at the repository root.
# Crate layout: crates/*, dependency direction is strictly one-way
# (types -> math -> memory -> container -> ... -> world -> extensions).

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# Source derived from proprietary Havok code: never publish to crates.io.
publish = false

[package]
name = "proton-engine"            # package 名必须与子 crate 的 "havok" 区分
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Umbrella library bundling the whole Havok Rust port behind one crate"

[lib]
name = "proton"                   # 使用者写 use proton::world::World;
path = "src/lib.rs"
# 需要 C ABI 动态库时再打开:
# crate-type = ["rlib", "cdylib"]

[dependencies]
base-types        = { path = "crates/base-types" }
base-math         = { path = "crates/base-math" }
base-memory       = { path = "crates/base-memory" }
base-container    = { path = "crates/base-container" }
base-thread       = { path = "crates/base-thread" }
base-geometry     = { path = "crates/base-geometry" }
base-serialize    = { path = "crates/base-serialize" }
phys-types      = { path = "crates/phys-types" }
phys-shape      = { path = "crates/phys-shape" }
phys-collide    = { path = "crates/phys-collide" }
phys-body       = { path = "crates/phys-body" }
phys-solver     = { path = "crates/phys-solver" }
phys-world      = { path = "crates/phys-world" }
phys-extensions = { path = "crates/phys-extensions" }

# benches/simulation.rs 使用 harness = false，搬过来后必须显式声明
[[bench]]
name = "simulation"
harness = false

# Floating-point determinism note:
# Havok's simulation relies on bit-exact float32 reproduction. Rust does not
# reorder or contract FP expressions by default - keep it that way. Never
# enable fast-math style optimizations (FMA contraction, reassociation) in
# math or solver code, and validate against the C++ golden traces (Phase 9).
#
# External dependencies are introduced per phase (see README):
#   Phase 2+: none planned for base-math (hand-ported for determinism)
#   Phase 4+: rayon (candidate for the multithreaded simulation)
#   Phase 3+: bytemuck, hashbrown
#   Phase 1+: thiserror
